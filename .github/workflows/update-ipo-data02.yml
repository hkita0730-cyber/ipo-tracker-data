name: Update IPO data (v17 incremental)

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch IPO data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_jquants.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import date, timedelta

          data = json.loads(Path("docs/latest.json").read_text(encoding="utf-8"))
          assert isinstance(data, list) and len(data) >= 118, f"too few records: {len(data)}"

          codes = [str(x.get("code4") or x.get("code") or "") for x in data]
          assert len(codes) == len(set(codes)), "duplicate security codes"
          assert all(re.fullmatch(r"(?:\d{4}|\d{3}[A-Z])", c) for c in codes), "non-canonical code"
          assert all("インタビュー" not in str(x.get("name", "")) for x in data), "interview text remains"

          cutoff = (date.today() - timedelta(days=1095)).isoformat()
          recent3y = [x for x in data if str(x.get("listedDate","")) >= cutoff]

          by_year = {}
          for x in data:
              d = str(x.get("listedDate",""))
              if len(d) >= 4:
                  by_year[d[:4]] = by_year.get(d[:4], 0) + 1

          print("year coverage:", by_year)
          print(f"validated total={len(data)} recent3y={len(recent3y)}")

          assert len(recent3y) >= 150, f"recent-3y recovery still too small: {len(recent3y)}"
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet || git commit -m "Update IPO data (v17 incremental)"
          git push
