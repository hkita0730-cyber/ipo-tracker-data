name: Update Mutant monthly report

on:
  schedule:
    # 毎月10日・12日・15日の10:15（日本時間）に確認
    - cron: "15 1 10,12,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mutant:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install "pypdf>=6,<7"

      - name: Read latest monthly report
        run: python scripts/fetch_mutant.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- docs/mutant-latest.json; then
            echo "No new monthly report"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mutant-latest.json
          git commit -m "Update Mutant monthly report"
          git push
