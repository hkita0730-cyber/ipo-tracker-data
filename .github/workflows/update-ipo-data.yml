name: Update IPO data (FAST v12)

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch IPO data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_jquants.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs/latest.json").read_text(encoding="utf-8"))
          assert isinstance(data, list)
          assert len(data) >= 180, f"too few records: {len(data)}"

          codes = [str(x.get("code4", "")) for x in data]
          assert len(codes) == len(set(codes)), "duplicate security codes"
          assert all("インタビュー" not in str(x.get("name", "")) for x in data)

          by_year = {}
          for x in data:
              d = str(x.get("listedDate", ""))
              if len(d) >= 4:
                  by_year[d[:4]] = by_year.get(d[:4], 0) + 1

          print("year coverage:", by_year)

          assert by_year.get("2025", 0) >= 55, \
              f"2025 coverage too low: {by_year.get('2025',0)}"
          assert by_year.get("2024", 0) >= 75, \
              f"2024 coverage too low: {by_year.get('2024',0)}"
          assert by_year.get("2026", 0) >= 15, \
              f"2026 coverage too low: {by_year.get('2026',0)}"

          evaluations = sum(
              str(x.get("ipoEvaluation", "")) in ("S","A","B","C","D")
              for x in data
          )
          print(f"validated {len(data)} records; evaluations={evaluations}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet || git commit -m "Update IPO data (FAST v12)"
          git push
