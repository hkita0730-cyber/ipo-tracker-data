name: Update IPO data (FAST v15)

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch IPO data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_jquants.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date, timedelta

          data = json.loads(Path("docs/latest.json").read_text(encoding="utf-8"))
          assert isinstance(data, list)

          codes = [str(x.get("code4", "")) for x in data]
          assert len(codes) == len(set(codes)), "duplicate security codes"
          assert all("インタビュー" not in str(x.get("name", "")) for x in data)

          cutoff = (date.today() - timedelta(days=1095)).isoformat()
          recent3y = [
              x for x in data
              if str(x.get("listedDate", "")) >= cutoff
          ]

          assert len(data) >= 150, \
              f"too few total records: {len(data)}"
          assert len(recent3y) >= 120, \
              f"too few recent-3y records: {len(recent3y)}"

          by_year = {}
          for x in data:
              d = str(x.get("listedDate", ""))
              if len(d) >= 4:
                  by_year[d[:4]] = by_year.get(d[:4], 0) + 1

          verified = sum(
              bool(x.get("officialCodeNameVerified"))
              for x in data
          )

          evaluations = sum(
              str(x.get("ipoEvaluation", "")) in ("S","A","B","C","D")
              for x in data
          )

          links = sum(
              str(x.get("ipoSourceUrl", "")).startswith(
                  "https://ipokabu.net/ipo/"
              )
              for x in data
          )

          print("year coverage:", by_year)
          print(
              f"validated total={len(data)} "
              f"recent3y={len(recent3y)} "
              f"JPX-verified={verified} "
              f"庶民評価={evaluations} "
              f"links={links}"
          )

          # 庶民のIPOは補助情報なので、
          # 評価取得件数が少なくてもRun自体は止めない。
          assert verified >= 100, \
              f"JPX verification unexpectedly low: {verified}"
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet || git commit -m "Update IPO data (FAST v15)"
          git push
