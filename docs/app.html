<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPO掘り出し物モニター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<style>
:root{
  --paper:#EFECE2;
  --paper-raised:#F8F6EF;
  --ink:#1C2329;
  --ink-soft:#5B6570;
  --line:#D8D3C4;
  --line-strong:#B9B29C;
  --accent:#2B4C55;
  --accent-soft:#DCE6E4;
  --up:#B23A2F;
  --down:#2F6FA6;
  --gem:#A8791E;
  --gem-bg:#F4E9D3;
  --danger-bg:#F6E4E1;
  --radius-s:3px;
  --radius-m:6px;
  --font-ui:'Zen Kaku Gothic New',sans-serif;
  --font-num:'JetBrains Mono',monospace;
}
:root[data-theme="dark"]{
  --paper:#14181B;
  --paper-raised:#1D2226;
  --ink:#E9E4D6;
  --ink-soft:#93998F;
  --line:#33383B;
  --line-strong:#4B5155;
  --accent:#7FAFB5;
  --accent-soft:#20343A;
  --up:#E0685C;
  --down:#5FA0D6;
  --gem:#E0B454;
  --gem-bg:#332A16;
  --danger-bg:#3A2321;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
button, input, select, textarea{font-family:inherit; color:inherit;}
.mono{font-family:var(--font-num);}
a{color:var(--accent);}

/* ---------- shell ---------- */
#app{display:flex; flex-direction:column; min-height:100vh;}

header.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--paper); border-bottom:1px solid var(--line-strong);
  padding:10px 16px 0 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand-mark{font-size:20px;}
.brand-name{font-weight:900; font-size:17px; letter-spacing:.02em;}
.brand-sub{font-size:11px; color:var(--ink-soft);}
.updated-pill{
  font-family:var(--font-num); font-size:11px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:20px; padding:4px 10px;
  white-space:nowrap;
}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding-bottom:0;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; padding:9px 14px; font-size:13.5px; font-weight:500;
  color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer;
  white-space:nowrap;
}
.tab.active{color:var(--ink); font-weight:700; border-bottom-color:var(--accent);}

main{flex:1; padding:16px; padding-bottom:64px; max-width:1180px; width:100%; margin:0 auto;}

.section-title{font-size:15px; font-weight:700; margin:22px 0 10px 0; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}
.section-desc{font-size:12px; color:var(--ink-soft); margin:-6px 0 12px 0;}

.card{
  background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:14px;
}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px;}

/* ---------- dashboard summary tiles ---------- */
.tile-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:8px;}
@media (max-width:640px){.tile-row{grid-template-columns:repeat(2,1fr);}}
.tile{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; text-align:left;}
.tile .num{font-family:var(--font-num); font-size:22px; font-weight:700;}
.tile .label{font-size:11px; color:var(--ink-soft); margin-top:2px;}

/* ---------- stock card / row ---------- */
.stock-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:12px 14px; cursor:pointer; position:relative;
}
.stock-card:active{background:var(--accent-soft);}
.stock-card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.stock-name{font-weight:700; font-size:14.5px;}
.stock-code{font-family:var(--font-num); font-size:11.5px; color:var(--ink-soft);}
.star-btn{background:none; border:none; font-size:19px; padding:2px; line-height:1; cursor:pointer; color:var(--line-strong);}
.star-btn.on{color:var(--gem);}
.metric-line{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
.metric{font-size:12px;}
.metric .k{color:var(--ink-soft); margin-right:4px;}
.metric .v{font-family:var(--font-num); font-weight:700;}
.v.up{color:var(--up);}
.v.down{color:var(--down);}
.badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  border-radius:20px; padding:3px 9px; white-space:nowrap;
}
.badge.gem{background:var(--gem-bg); color:var(--gem);}
.badge.alert{background:var(--danger-bg); color:var(--up);}
.badge.score{background:var(--accent-soft); color:var(--accent);}
.badge.upcoming{background:var(--line); color:var(--ink-soft);}
.badge-row{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}

/* ---------- table (landscape list) ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper-raised);}
table.ipo-table{border-collapse:collapse; width:100%; min-width:920px; font-size:12.5px;}
table.ipo-table th, table.ipo-table td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap;}
table.ipo-table th:first-child, table.ipo-table td:first-child{text-align:left; position:sticky; left:0; background:var(--paper-raised);}
table.ipo-table th{color:var(--ink-soft); font-weight:500; cursor:pointer; user-select:none;}
table.ipo-table th.sorted{color:var(--ink); font-weight:700;}
table.ipo-table td.num{font-family:var(--font-num);}
table.ipo-table tr.rowlink:hover{background:var(--accent-soft); cursor:pointer;}

.view-toggle{display:flex; gap:6px; margin-bottom:12px;}
.chip-btn{
  border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:20px;
  padding:6px 13px; font-size:12.5px; cursor:pointer;
}
.chip-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- filters ---------- */
.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filter-bar input[type=text]{
  flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line-strong);
  border-radius:var(--radius-m); background:var(--paper-raised); font-size:13.5px;
}
select{padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--radius-m); background:var(--paper-raised); font-size:13px;}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  padding:10px 16px; border-radius:var(--radius-m); font-size:14px; font-weight:700; cursor:pointer;
}
.btn.secondary{background:var(--paper-raised); color:var(--ink); border-color:var(--line-strong); font-weight:500;}
.btn.danger{background:var(--paper-raised); color:var(--up); border-color:var(--up); font-weight:500;}
.btn:active{opacity:.75;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---------- forms ---------- */
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px 14px;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11.5px; color:var(--ink-soft);}
.field input, .field textarea, .field select{
  padding:9px 10px; border:1px solid var(--line-strong); border-radius:var(--radius-s);
  background:var(--paper-raised); font-size:13.5px; width:100%;
}
.field textarea{resize:vertical; min-height:60px; font-family:var(--font-ui);}
.field-note{font-size:10.5px; color:var(--ink-soft);}
fieldset{border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px 16px; margin:0 0 16px 0;}
legend{padding:0 6px; font-size:12.5px; font-weight:700; color:var(--accent);}

/* ---------- detail view ---------- */
.detail-header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px;}
.detail-title{font-size:19px; font-weight:900;}
.back-btn{background:none; border:none; font-size:14px; color:var(--accent); cursor:pointer; padding:6px 0 12px 0; display:flex; align-items:center; gap:4px;}
.kv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px 16px;}
.kv{border-bottom:1px dashed var(--line);}
.kv .k{font-size:11px; color:var(--ink-soft);}
.kv .v{font-family:var(--font-num); font-size:14.5px; font-weight:700; margin-top:2px; padding-bottom:6px;}

.score-bar-wrap{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.score-bar-row{display:grid; grid-template-columns:110px 1fr 48px; align-items:center; gap:8px; font-size:12px;}
.score-bar-track{background:var(--line); border-radius:20px; height:8px; overflow:hidden;}
.score-bar-fill{background:var(--accent); height:100%; border-radius:20px;}
.score-total{display:flex; align-items:baseline; gap:8px; margin-top:14px;}
.score-total .num{font-family:var(--font-num); font-size:34px; font-weight:900; color:var(--gem);}

.chart-wrap{width:100%; overflow-x:auto;}
svg.price-chart{display:block;}

.note-disclaimer{font-size:11px; color:var(--ink-soft); border-left:3px solid var(--line-strong); padding:6px 10px; margin:10px 0;}

.ai-block{display:grid; gap:10px; grid-template-columns:1fr; margin-top:6px;}
.ai-card{border:1px solid var(--line); border-radius:var(--radius-m); padding:10px 12px; background:var(--paper-raised);}
.ai-card h4{margin:0 0 6px 0; font-size:12px; letter-spacing:.02em; color:var(--accent);}
.ai-card p{margin:0; font-size:13px; line-height:1.6;}

.empty-state{text-align:center; padding:40px 16px; color:var(--ink-soft);}
.empty-state .big{font-size:32px; margin-bottom:8px;}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px;
  font-size:13px; z-index:100; opacity:0; transition:opacity .2s; pointer-events:none;
}
.toast.show{opacity:1;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background:var(--paper); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:760px){
  .modal-overlay{align-items:center;}
  .modal-sheet{border-radius:12px; max-height:82vh;}
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px;}
.close-x{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--ink-soft); padding:4px;}

.switch-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
.switch-row:last-child{border-bottom:none;}
.switch{position:relative; width:44px; height:26px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider-tgl{position:absolute; inset:0; background:var(--line-strong); border-radius:20px; cursor:pointer; transition:.15s;}
.slider-tgl:before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
input:checked + .slider-tgl{background:var(--accent);}
input:checked + .slider-tgl:before{transform:translateX(18px);}

hr.div{border:none; border-top:1px solid var(--line); margin:18px 0;}

@media print{ header.topbar{display:none;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script>
/* =========================================================================
   IPO掘り出し物モニター — 個人用（iPad Safari 単体動作 / IndexedDB永続化）
   GitHub Actionsの自動フィード＋iPad IndexedDB（手入力データも保持）
   ========================================================================= */

/* ---------------------------- IndexedDB layer ---------------------------- */
const DB_NAME = "ipo_tracker_db";
const DB_VERSION = 1;
const DATA_SCHEMA_VERSION = 5; // バックアップの互換管理用
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains("stocks")){
        _db.createObjectStore("stocks", {keyPath:"code"});
      }
      if(!_db.objectStoreNames.contains("settings")){
        _db.createObjectStore("settings", {keyPath:"key"});
      }
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e);
  });
}

function txStore(name, mode){ return db.transaction(name, mode).objectStore(name); }

function idbGetAll(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readonly").getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = (e)=>reject(e);
  });
}
function idbPut(store, value){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readwrite").put(value);
    req.onsuccess = ()=>resolve();
    req.onerror = (e)=>reject(e);
  });
}
function idbDelete(store, key){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readwrite").delete(key);
    req.onsuccess = ()=>resolve();
    req.onerror = (e)=>reject(e);
  });
}
function idbGet(store, key){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readonly").get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e);
  });
}

/* ---------------------------- App state ---------------------------- */
const state = {
  stocks: [],           // 全銘柄
  settings: {
    key:"main",
    dataVersion: DATA_SCHEMA_VERSION,
    darkMode:false,
    feedUrl:"",
    priceFeedUrl:"",
    lastAutoSync:null,
    lastPriceSync:null,
    retentionDays: 1460,
    thresholds:{
      minDaysListed:90,
      minRevenueGrowth:15,
      minOpProfitGrowth:15,
      minDropFromFirstDay:30,
      requireOpCFPositive:true,
      requireForecastNotWorse:true
    }
  },
  view: "dashboard",     // dashboard | list | watchlist | gems | ranking | analysis | settings | detail | addstock
  detailCode: null,
  listSort: {key:"listedDate", dir:-1},
  listFilter: {text:"", onlyUpcoming:false, showExpired:false},
  rankKind: "total"
};

/* ---------------------------- Sample seed data ----------------------------
   初回起動時のみ、操作方法を体験できるサンプルを2件投入する（実データではない旨を明示）。
------------------------------------------------------------------------- */
function sampleStocks(){
  const today = new Date();
  const daysAgo = (n)=>{ const d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  return [
    {
      code:"9999",
      name:"（サンプル）フィクション・テック株式会社",
      market:"グロース",
      listedDate:daysAgo(210),
      ipoPrice:1200, firstDayPrice:2400,
      currentPrice:1430, currentPriceUpdatedAt:new Date().toISOString(),
      prevClose:1455, volume:184300,
      week52High:2550, week52Low:1380, allTimeHigh:2550, allTimeLow:1380,
      marketCap:8580000000, publicShares:1200000, sellShares:300000,
      assumedPriceRange:"1100〜1200円", leadUnderwriter:"サンプル証券",
      upcoming:false,
      bookValuePerShare:410, sharesOutstanding:6000000,
      popularIpo:{
        rating:5, attention:"高い", assumedPrice:1150, firstDayForecast:2000,
        forecastRangeLow:1800, forecastRangeHigh:2200,
        evaluation:"事業モデルへの期待から人気化。初値は公開価格を大きく上回る予想。",
        sourceUrl:"", retrievedDate:daysAgo(215)
      },
      financials:[
        {reportDate:daysAgo(30), revenue:3200000000, revenueGrowth:29, opProfit:410000000, opProfitGrowth:43,
         ordinaryProfit:400000000, netProfit:280000000, eps:46.7, opMargin:12.8, roe:14.2, equityRatio:38.5,
         opCF:390000000, freeCF:210000000, guidance:"通期3200百万円→上方修正の可能性言及",
         revisionUp:true, revisionDown:false, progressRate:78}
      ],
      priceHistory:[
        {date:daysAgo(210), price:2400},{date:daysAgo(180), price:2100},
        {date:daysAgo(120), price:1900},{date:daysAgo(90), price:1650},
        {date:daysAgo(60), price:1500},{date:daysAgo(30), price:1600},
        {date:daysAgo(1), price:1430}
      ],
      memo:"競争優位性はまだ見極め中。次回決算のCF動向を確認したい。",
      watchlisted:true,
      dataSource:"手入力（サンプル）", dataRetrievedAt:new Date().toISOString()
    },
    {
      code:"8888",
      name:"（サンプル）来期上場予定サンプル・ホールディングス",
      market:"未定",
      listedDate:null,
      plannedListingDate:daysAgo(-45),
      ipoPrice:null, firstDayPrice:null, currentPrice:null,
      upcoming:true,
      assumedPriceRange:"未定", leadUnderwriter:"未定",
      popularIpo:{rating:null, attention:"注目集まりつつあり", assumedPrice:null, firstDayForecast:null,
        forecastRangeLow:null, forecastRangeHigh:null, evaluation:"上場承認直後。詳細は今後開示予定。",
        sourceUrl:"", retrievedDate:daysAgo(2)},
      financials:[], priceHistory:[], memo:"", watchlisted:false,
      dataSource:"手入力（サンプル）", dataRetrievedAt:new Date().toISOString()
    }
  ];
}

/* ---------------------------- Calculations ---------------------------- */
function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }

/* 上場から設定日数(既定1460日=4年)を超えた銘柄は「監視対象」からは外すが、
   バックアップデータからは削除しない。Watchlist登録済み・上場予定・上場日未入力の
   銘柄は対象から除外しない（誤って隠さないため）。 */
function withinRetention(s){
  if(s.upcoming) return true;
  if(s.watchlisted) return true;
  if(!s.listedDate) return true;
  const days = daysBetween(s.listedDate, new Date());
  return days <= state.settings.retentionDays;
}
function pct(now, base){ if(now==null||base==null||base===0) return null; return ((now-base)/base)*100; }
function fmtPct(v){ if(v==null||isNaN(v)) return "—"; const s=v>=0?"+":""; return s+v.toFixed(1)+"%"; }
function fmtNum(v, digits=0){ if(v==null||isNaN(v)) return "—"; return Number(v).toLocaleString("ja-JP",{maximumFractionDigits:digits}); }
function fmtYen(v){ if(v==null||isNaN(v)) return "—"; return "¥"+fmtNum(v); }
function fmtDate(v){ if(!v) return "—"; return v; }

function latestFinancial(stock){
  if(!stock.financials || stock.financials.length===0) return null;
  return [...stock.financials].sort((a,b)=> new Date(b.reportDate)-new Date(a.reportDate))[0];
}

function computeMetrics(stock){
  const daysListed = stock.listedDate ? daysBetween(stock.listedDate, new Date()) : null;
  const firstDayChg = pct(stock.firstDayPrice, stock.ipoPrice);
  const fromIpoPrice = pct(stock.currentPrice, stock.ipoPrice);
  const fromFirstDay = pct(stock.currentPrice, stock.firstDayPrice);
  const fromAth = pct(stock.currentPrice, stock.allTimeHigh);
  const fin = latestFinancial(stock);
  let per = null, pbr=null, psr=null;
  if(fin && fin.eps && fin.eps>0 && stock.currentPrice!=null) per = stock.currentPrice / fin.eps;
  if(stock.bookValuePerShare && stock.currentPrice!=null) pbr = stock.currentPrice / stock.bookValuePerShare;
  if(fin && fin.revenue && stock.sharesOutstanding && stock.currentPrice!=null){
    const salesPerShare = fin.revenue / stock.sharesOutstanding;
    if(salesPerShare>0) psr = stock.currentPrice / salesPerShare;
  }
  return {daysListed, firstDayChg, fromIpoPrice, fromFirstDay, fromAth, fin, per, pbr, psr};
}

function computeScore(stock){
  const m = computeMetrics(stock);
  const fin = m.fin;
  let growth=0, profit=0, finance=0, forecast=0, valuation=0;
  if(fin){
    // 成長性 0-30
    growth += Math.max(0, Math.min(15, (fin.revenueGrowth||0)/2));
    growth += Math.max(0, Math.min(15, (fin.opProfitGrowth||0)/2));
    // 収益性 0-20
    profit += Math.max(0, Math.min(10, (fin.opMargin||0)/2));
    profit += Math.max(0, Math.min(10, (fin.roe||0)/2));
    // 財務 0-20
    finance += Math.max(0, Math.min(10, (fin.equityRatio||0)/5));
    finance += (fin.freeCF>0 ? 10 : (fin.opCF>0 ? 5 : 0));
    // 業績予想 0-15
    if(fin.revisionUp) forecast += 15;
    else if(fin.revisionDown) forecast += 0;
    else forecast += Math.max(0, Math.min(15, (fin.progressRate||0)/100*15));
  }
  // 株価・バリュエーション 0-15（PERが低いほど・初値からの下落幅が大きいほど加点。ただし赤字は判定不能扱い）
  if(m.per!=null && m.per>0){
    valuation += Math.max(0, Math.min(8, (40 - m.per) / 40 * 8));
  }
  if(m.fromFirstDay!=null && m.fromFirstDay<0){
    valuation += Math.max(0, Math.min(7, (-m.fromFirstDay)/50*7));
  }
  const total = growth+profit+finance+forecast+valuation;
  return {
    growth:round1(growth), profit:round1(profit), finance:round1(finance),
    forecast:round1(forecast), valuation:round1(valuation),
    total: Math.round(Math.min(100,total))
  };
}
function round1(v){ return Math.round(v*10)/10; }

function isBargain(stock, th){
  const m = computeMetrics(stock);
  const fin = m.fin;
  if(stock.upcoming) return false;
  if(m.daysListed==null || m.daysListed < th.minDaysListed) return false;
  if(!fin) return false;
  if((fin.revenueGrowth||-999) < th.minRevenueGrowth) return false;
  if((fin.opProfitGrowth||-999) < th.minOpProfitGrowth) return false;
  if(th.requireOpCFPositive && !(fin.opCF>0)) return false;
  if(m.fromFirstDay==null || m.fromFirstDay > -th.minDropFromFirstDay) return false;
  if(th.requireForecastNotWorse && fin.revisionDown) return false;
  return true;
}

function stockAlerts(stock){
  const m = computeMetrics(stock);
  const fin = m.fin;
  const alerts = [];
  if(m.fromFirstDay!=null){
    if(m.fromFirstDay <= -50) alerts.push({level:3, text:"初値から50%以上下落"});
    else if(m.fromFirstDay <= -40) alerts.push({level:2, text:"初値から40%以上下落"});
    else if(m.fromFirstDay <= -30) alerts.push({level:1, text:"初値から30%以上下落"});
  }
  if(fin && fin.revenueGrowth>=15 && fin.opProfitGrowth>=15){
    alerts.push({level:1, text:"増収増益率ともに15%以上"});
  }
  if(fin && fin.revisionUp){
    alerts.push({level:1, text:"業績が上方修正されています"});
  }
  const bargainNow = isBargain(stock, state.settings.thresholds);
  if(bargainNow && fin && m.fromFirstDay!=null && m.fromFirstDay<0){
    alerts.push({level:3, text:"★最重要：業績好調＋株価下落＋割安の条件に合致", top:true});
  }
  return alerts;
}

function popularVsActual(stock){
  const p = stock.popularIpo || {};
  const diff = (p.firstDayForecast!=null && stock.firstDayPrice!=null) ? stock.firstDayPrice - p.firstDayForecast : null;
  const historyAt = (days)=>{
    if(!stock.listedDate || !stock.priceHistory) return null;
    const target = new Date(stock.listedDate); target.setDate(target.getDate()+days);
    let best=null, bestDiff=Infinity;
    stock.priceHistory.forEach(ph=>{
      const d = Math.abs(new Date(ph.date)-target);
      if(d<bestDiff){bestDiff=d; best=ph.price;}
    });
    return best;
  };
  return {
    forecast: p.firstDayForecast,
    actualFirstDay: stock.firstDayPrice,
    diff,
    d30: historyAt(30), d90: historyAt(90), d180: historyAt(180), d365: historyAt(365),
    current: stock.currentPrice
  };
}

/* ---------------------------- Rule-based "決算分析" ----------------------------
   注意：これは生成AIによる自然文解析ではなく、入力データからの条件分岐で作る
   簡易サマリーです（サーバー／API連携なしのローカル計算のため）。事実（数値）と、
   ここでの評価（推測に基づく所見）は明確に分けて表示します。
------------------------------------------------------------------------- */
function ruleBasedAnalysis(stock){
  const m = computeMetrics(stock);
  const fin = m.fin;
  if(!fin) return null;
  const good=[], bad=[], change=[];
  if(fin.revenueGrowth>=15) good.push(`売上成長率が${fin.revenueGrowth}%と高水準`);
  if(fin.opProfitGrowth>=15) good.push(`営業利益成長率が${fin.opProfitGrowth}%と高水準`);
  if(fin.opCF>0) good.push("営業キャッシュフローが黒字");
  if(fin.freeCF>0) good.push("フリーキャッシュフローが黒字");
  if(fin.revisionUp) good.push("業績予想が上方修正されている");
  if(fin.revenueGrowth<10) bad.push("売上成長率が10%未満に鈍化");
  if(fin.opProfitGrowth<0) bad.push("営業利益が減益");
  if(fin.opCF<=0) bad.push("営業キャッシュフローがマイナス");
  if(fin.revisionDown) bad.push("業績予想が下方修正されている");
  if(fin.equityRatio<20) bad.push("自己資本比率が20%未満");
  if(good.length===0 && bad.length===0) change.push("前回比較のための十分なデータがありません");
  const valuationNote = (m.per!=null)
    ? `PER${m.per.toFixed(1)}倍。初値からの騰落率は${fmtPct(m.fromFirstDay)}。`
    : `EPSが赤字またはデータ不足のためPER算定不可。初値からの騰落率は${fmtPct(m.fromFirstDay)}。`;
  const riskNotes=[];
  if(fin.progressRate!=null && fin.progressRate<70) riskNotes.push("通期進捗率がやや低め");
  if(!stock.popularIpo || !stock.popularIpo.evaluation) riskNotes.push("庶民のIPO評価が未登録");
  const score = computeScore(stock);
  let priority = "D";
  if(score.total>=80) priority="A"; else if(score.total>=60) priority="B"; else if(score.total>=40) priority="C";
  const summaryParts=[];
  summaryParts.push(`IPO VALUE SCOREは${score.total}点。`);
  summaryParts.push(good.length ? `好材料は${good.length}件検出。` : "目立った好材料は検出されず。");
  summaryParts.push(bad.length ? `注意点は${bad.length}件検出。` : "目立った悪材料は検出されず。");
  summaryParts.push(valuationNote);
  return {good, bad, change, valuationNote, riskNotes, summary:summaryParts.join(""), priority};
}

/* ---------------------------- 自動更新フィード（GitHub Actions等が生成するJSONを取り込む） ----------------------------
   期待するJSON形式（例）：
   [
     { "code":"1234", "name":"...", "market":"グロース", "listedDate":"2026-01-15",
       "ipoPrice":1200, "firstDayPrice":2400, "currentPrice":1430, "currentPriceUpdatedAt":"2026-09-05T00:00:00Z",
       "prevClose":1455, "volume":184300, "week52High":2550, "week52Low":1380,
       "allTimeHigh":2550, "allTimeLow":1380, "marketCap":8580000000,
       "sharesOutstanding":6000000, "bookValuePerShare":410,
       "financials":[{"reportDate":"2026-08-01","revenue":3200000000,"revenueGrowth":29, ... }],
       "priceHistory":[{"date":"2026-08-01","price":1600}],
       "dataSource":"J-Quants API", "dataRetrievedAt":"2026-09-05T00:00:00Z" }
   ]
   memo / watchlisted / popularIpo / upcoming はユーザー入力のため上書きしません。
------------------------------------------------------------------------------------------------------------------ */
function canonicalTseCode(raw){
  let s = String(raw ?? "").trim().toUpperCase().replace(/\.T$/,"");
  // J-Quants 5桁形式: 83030 -> 8303 / 485A0 -> 485A
  if(/^\d{4}0$/.test(s)) return s.slice(0,4);
  if(/^\d{3}[A-Z]0$/.test(s)) return s.slice(0,4);
  return s;
}

function cleanFeedCompanyName(raw){
  return String(raw ?? "")
    .replace(/(?:代表者|創業者|社長|経営者)\s*インタビュー/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function normalizePriceHistory(arr){
  const map = new Map();
  (arr||[]).forEach(p=>{
    if(!p || !p.date) return;
    const price = p.price ?? p.close ?? null;
    if(price==null) return;
    map.set(p.date, {...p, price, close:(p.close ?? price)});
  });
  return [...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function mergeByKey(existingArr, incomingArr, keyName){
  const map = new Map();
  (existingArr||[]).forEach(x=>{
    if(x && x[keyName]!=null) map.set(x[keyName], {...x});
  });
  (incomingArr||[]).forEach(x=>{
    if(x && x[keyName]!=null) map.set(x[keyName], {...map.get(x[keyName]), ...x});
  });
  return [...map.values()].sort((a,b)=> new Date(a[keyName]) - new Date(b[keyName]));
}

function normalizeFeedItem(raw){
  const code = canonicalTseCode(raw.code4 ?? raw.code);
  const history = normalizePriceHistory(raw.priceHistory || []);
  const ipoPrice = raw.ipoPrice ?? raw.publicPrice ?? null;
  const firstDayPrice = raw.firstDayPrice ?? raw.initialPrice ?? null;

  let popularIpo = null;
  const evaluation = String(
    raw.ipoEvaluation ?? raw.ipoAttention ?? raw.ipoRating ?? ""
  ).toUpperCase();
  if(["S","A","B","C","D"].includes(evaluation)){
    popularIpo = {
      evaluation,
      sourceUrl: raw.ipoSourceUrl || (`https://ipokabu.net/ipo/${code}`)
    };
  }

  return {
    ...raw,
    code,
    name: cleanFeedCompanyName(raw.name),
    ipoPrice,
    firstDayPrice,
    priceHistory: history,
    currentPriceUpdatedAt: raw.currentPriceUpdatedAt || raw.priceAsOfDate || raw.dataRetrievedAt || null,
    popularIpoFromFeed: popularIpo
  };
}

async function migrateStoredStocksV9(){
  const all = await idbGetAll("stocks");
  if(!all.length) return;

  const groups = new Map();
  for(const raw of all){
    const code = canonicalTseCode(raw.code);
    if(!code) continue;
    if(!groups.has(code)) groups.set(code, []);
    groups.get(code).push(raw);
  }

  // まず旧キーを削除。83030/485A0 等を確実に消す。
  for(const raw of all){
    const canonical = canonicalTseCode(raw.code);
    if(canonical && canonical !== raw.code){
      await idbDelete("stocks", raw.code);
    }
  }

  for(const [code, group] of groups){
    const canonicalRow = group.find(x=>String(x.code)===code);
    const base = {...(canonicalRow || group[0])};

    let mergedHistory = [];
    let mergedFinancials = [];
    let watchlisted = false;
    let memo = "";
    let popularIpo = base.popularIpo || {};

    for(const row of group){
      mergedHistory = mergeByKey(mergedHistory, normalizePriceHistory(row.priceHistory), "date");
      mergedFinancials = mergeByKey(mergedFinancials, row.financials || [], "reportDate");
      watchlisted = watchlisted || !!row.watchlisted;
      if(!memo && row.memo) memo = row.memo;
      if((!popularIpo || !popularIpo.rating) && row.popularIpo?.rating) popularIpo = row.popularIpo;
    }

    const migrated = {
      ...base,
      code,
      name: cleanFeedCompanyName(base.name),
      ipoPrice: base.ipoPrice ?? base.publicPrice ?? null,
      firstDayPrice: base.firstDayPrice ?? base.initialPrice ?? null,
      priceHistory: mergedHistory,
      financials: mergedFinancials,
      watchlisted,
      memo,
      popularIpo: popularIpo ? {
        evaluation: String(
          popularIpo.evaluation || popularIpo.attention || popularIpo.sourceRating || ""
        ).toUpperCase(),
        sourceUrl: popularIpo.sourceUrl || ""
      } : {}
    };
    await idbPut("stocks", migrated);
  }

  const s = await idbGet("settings","main");
  if(s && (!s.retentionDays || s.retentionDays < 1460)){
    s.retentionDays = 1460;
    await idbPut("settings", s);
  }
}

async function mergeFeedData(rawItems){
  const items = (rawItems||[]).map(normalizeFeedItem).filter(x=>x.code);
  const incomingCodes = new Set(items.map(x=>x.code));
  let count = 0;

  for(const item of items){
    const existing = findStock(item.code);
    const base = existing ? {...existing} : {
      memo:"", watchlisted:false, popularIpo:{}, upcoming:false, financials:[], priceHistory:[]
    };

    const feedPopular = item.popularIpoFromFeed;
    const mergedPopular = feedPopular
      ? {...(base.popularIpo||{}), ...feedPopular}
      : (base.popularIpo||{});

    const merged = {
      ...base,

      // 自動取得マスターは常に最新feedを正とする
      code:item.code,
      name:item.name || cleanFeedCompanyName(base.name),
      market:item.market || base.market,
      listedDate:item.listedDate || base.listedDate,

      // ユーザー入力項目は維持
      memo:base.memo || "",
      watchlisted:!!base.watchlisted,
      upcoming: item.upcoming!=null ? item.upcoming : !!base.upcoming,
      popularIpo: mergedPopular,

      // publicPrice/initialPrice と旧HTML名を橋渡し
      ipoPrice:item.ipoPrice ?? base.ipoPrice ?? base.publicPrice,
      firstDayPrice:item.firstDayPrice ?? base.firstDayPrice ?? base.initialPrice,

      currentPrice:item.currentPrice ?? base.currentPrice,
      currentPriceUpdatedAt:item.currentPriceUpdatedAt || base.currentPriceUpdatedAt,
      prevClose:item.prevClose ?? base.prevClose,
      volume:item.volume ?? base.volume,
      week52High:item.week52High ?? base.week52High,
      week52Low:item.week52Low ?? base.week52Low,
      allTimeHigh:item.allTimeHigh ?? base.allTimeHigh,
      allTimeLow:item.allTimeLow ?? base.allTimeLow,
      marketCap:item.marketCap ?? base.marketCap,

      publicShares:item.publicShares ?? base.publicShares,
      sellShares:item.sellShares ?? base.sellShares,
      assumedPriceRange:item.assumedPriceRange || base.assumedPriceRange,
      leadUnderwriter:item.leadUnderwriter || base.leadUnderwriter,
      sharesOutstanding:item.sharesOutstanding ?? base.sharesOutstanding,
      bookValuePerShare:item.bookValuePerShare ?? base.bookValuePerShare,

      financials: mergeByKey(base.financials, item.financials, "reportDate"),
      priceHistory: mergeByKey(
        normalizePriceHistory(base.priceHistory),
        normalizePriceHistory(item.priceHistory),
        "date"
      ),

      priceSource:item.priceSourceOverride || item.priceSource || (item.currentPrice!=null ? "yfinance" : base.priceSource),
      priceAsOfDate:item.priceAsOfDate || base.priceAsOfDate,
      dataSource:item.dataSource || base.dataSource || "JPX + 庶民のIPO + yfinance",
      dataRetrievedAt:item.dataRetrievedAt || new Date().toISOString(),

      // 診断用
      publicPriceSource:item.publicPriceSource || base.publicPriceSource,
      initialPriceSource:item.initialPriceSource || base.initialPriceSource,
      officialCodeNameVerified:item.officialCodeNameVerified ?? base.officialCodeNameVerified
    };

    await saveStock(merged);
    count++;
  }

  // feedに無い銘柄は削除しない。一時取得失敗で2024-2026銘柄が消えるのを防ぐ。
  // 削除するのは83030→8303等の旧5桁重複キーだけ。
  const snapshot = [...state.stocks];
  for(const s of snapshot){
    const canonical = canonicalTseCode(s.code);
    if(canonical !== s.code){
      await idbDelete("stocks", s.code);
      state.stocks = state.stocks.filter(x=>x.code!==s.code);
    }
  }

  // 念のため全社名を再クリーニング
  for(const s of [...state.stocks]){
    const cleaned = cleanFeedCompanyName(s.name);
    if(cleaned !== s.name){
      s.name = cleaned;
      await saveStock(s);
    }
  }

  return count;
}

/* ---------------------------- 最新株価フィード（Google Apps Script／GOOGLEFINANCE経由）----------------------------
   期待するJSON形式（例）：
   [ { "code":"1234", "price":1430, "asOf":"2026-09-05T14:00:00+09:00" }, ... ]
   財務・過去データは変更せず、現在株価とその基準時刻・データ源のみを更新します。
   取得できなかった銘柄（price が null）は上書きしません。
------------------------------------------------------------------------------------------------------------------ */
async function mergePriceFeedData(items){
  let count = 0;
  for(const item of items){
    if(!item.code || item.price==null) continue;
    const s = findStock(item.code);
    if(!s) continue;
    s.currentPrice = item.price;
    s.currentPriceUpdatedAt = item.asOf || new Date().toISOString();
    s.priceSource = "google_finance";
    s.priceAsOfDate = item.asOf || new Date().toISOString();
    if(item.prevClose!=null) s.prevClose = item.prevClose;
    if(item.volume!=null) s.volume = item.volume;
    s.priceHistory = s.priceHistory || [];
    const today = (item.asOf||new Date().toISOString()).slice(0,10);
    const idx = s.priceHistory.findIndex(p=>p.date===today);
    if(idx>=0) s.priceHistory[idx].price = item.price; else s.priceHistory.push({date:today, price:item.price});
    await saveStock(s);
    count++;
  }
  return count;
}

/* ---------------------------- 決算短信PDFの読み取り（パターン一致・要確認前提） ----------------------------
   ブラウザ単体でPDFのテキストを抽出し、決算短信でよく使われる項目名の近くにある数値を拾います。
   表構造は失われるため誤読の可能性があり、値は「自動読み取り（要確認）」として決算追加フォームに
   仮入力するのみで、保存前に必ず内容を確認・修正できるようにします。数値を推測で埋めることはしません。
------------------------------------------------------------------------------------------------------------------ */
const PDF_FIELD_PATTERNS = [
  {key:"revenue", labels:["売上高","営業収益"]},
  {key:"opProfit", labels:["営業利益"]},
  {key:"ordinaryProfit", labels:["経常利益"]},
  {key:"netProfit", labels:["親会社株主に帰属する当期純利益","当期純利益"]},
  {key:"eps", labels:["1株当たり当期純利益","１株当たり当期純利益"]},
  {key:"equityRatio", labels:["自己資本比率"]},
  {key:"opCF", labels:["営業活動によるキャッシュ・フロー"]},
  {key:"freeCF", labels:["フリー・キャッシュ・フロー","フリーキャッシュフロー"]},
  {key:"progressRate", labels:["進捗率"]}
];
function parseNumberToken(raw){
  if(!raw) return null;
  let s = raw.replace(/,/g,"").trim();
  let neg = false;
  if(s.startsWith("△") || s.startsWith("▲") || s.startsWith("-")){ neg=true; s=s.replace(/^[△▲\-]/,""); }
  const m = s.match(/-?\d+(\.\d+)?/);
  if(!m) return null;
  let v = parseFloat(m[0]);
  if(neg) v = -Math.abs(v);
  return v;
}
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let lines = [];
  for(let i=1;i<=Math.min(pdf.numPages, 6); i++){ // 決算短信サマリーは通常先頭数ページ
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let currentY = null, line = "";
    content.items.forEach(it=>{
      const y = it.transform[5];
      if(currentY===null || Math.abs(y-currentY)>3){
        if(line) lines.push(line);
        line = it.str; currentY = y;
      } else {
        line += " " + it.str;
      }
    });
    if(line) lines.push(line);
  }
  return lines;
}
function parseFinancialFromLines(lines){
  const result = {}; const unmatched = [];
  PDF_FIELD_PATTERNS.forEach(({key,labels})=>{
    let found = null;
    for(const line of lines){
      const hit = labels.find(l=>line.includes(l));
      if(hit){
        const after = line.slice(line.indexOf(hit)+hit.length);
        const num = parseNumberToken(after) ?? parseNumberToken(line);
        if(num!=null){ found = num; break; }
      }
    }
    if(found!=null) result[key] = found; else unmatched.push(key);
  });
  // 売上高・営業利益の直後に「(△12.3%)」のような増減率が入っているケースを拾う
  ["revenue","opProfit"].forEach(k=>{
    const growthKey = k==="revenue" ? "revenueGrowth" : "opProfitGrowth";
    const label = k==="revenue" ? ["売上高","営業収益"] : ["営業利益"];
    for(const line of lines){
      const hit = label.find(l=>line.includes(l));
      if(hit){
        const pctMatch = line.match(/[△▲]?\d+(\.\d+)?\s*%/);
        if(pctMatch){ result[growthKey] = parseNumberToken(pctMatch[0]); break; }
      }
    }
  });
  return {values:result, unmatched};
}

function openPdfImportModal(s){
  openModal("決算短信PDFから読み取り", (body,close)=>{
    body.appendChild(h("div",{class:"note-disclaimer"},"PDF内のテキストから項目名に近い数値を自動抽出します。表構造は失われるため誤読の可能性があります。抽出結果は次の画面で必ず確認・修正してから保存してください。"));

const TABLE_COLS = [
  {key:"name", label:"銘柄"},
  {key:"listedDate", label:"上場日"},
  {key:"daysListed", label:"経過日数", num:true},
  {key:"currentPrice", label:"現在株価", num:true, fmt:fmtYen},
  {key:"fromIpoPrice", label:"公開価格比", num:true, pct:true},
  {key:"fromFirstDay", label:"初値比", num:true, pct:true},
  {key:"revenueGrowth", label:"売上成長率", num:true, pct:true},
  {key:"opProfitGrowth", label:"営業益成長率", num:true, pct:true},
  {key:"per", label:"PER", num:true},
  {key:"score", label:"SCORE", num:true},
  {key:"popularRating", label:"庶民IPO", num:true}
];

function rowValue(s, key){
  const m = computeMetrics(s);
  switch(key){
    case "name": return s.name;
    case "listedDate": return s.upcoming ? (s.plannedListingDate||"—")+"予定" : (s.listedDate||"—");
    case "daysListed": return m.daysListed;
    case "currentPrice": return s.currentPrice;
    case "fromIpoPrice": return m.fromIpoPrice;
    case "fromFirstDay": return m.fromFirstDay;
    case "revenueGrowth": return m.fin? m.fin.revenueGrowth : null;
    case "opProfitGrowth": return m.fin? m.fin.opProfitGrowth : null;
    case "per": return m.per;
    case "score": return s.upcoming? null : computeScore(s).total;
    case "popularRating": return s.popularIpo ? ({S:5,A:4,B:3,C:2,D:1}[s.popularIpo.evaluation] ?? null) : null;
    default: return null;
  }
}

function renderTable(stocks){
  const sorted = [...stocks].sort((a,b)=>{
    const {key,dir} = state.listSort;
    let va = rowValue(a,key), vb = rowValue(b,key);
    if(typeof va === "string" || typeof vb === "string"){
      va = va==null? "" : String(va); vb = vb==null? "" : String(vb);
      return va.localeCompare(vb,"ja") * dir;
    }
    va = va==null? -Infinity : va; vb = vb==null? -Infinity : vb;
    return (va-vb) * dir;
  });
  const wrap = h("div",{class:"table-wrap"});
  const table = h("table",{class:"ipo-table"});
  const thead = h("thead",{});
  const trh = h("tr",{});
  TABLE_COLS.forEach(col=>{
    const th = h("th",{class: state.listSort.key===col.key ? "sorted":""}, col.label + (state.listSort.key===col.key ? (state.listSort.dir>0?" ▲":" ▼") : ""));
    th.addEventListener("click", ()=>{
      if(state.listSort.key===col.key) state.listSort.dir *= -1;
      else state.listSort = {key:col.key, dir:1};
      renderListBody();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = h("tbody",{});
  sorted.forEach(s=>{
    const tr = h("tr",{class:"rowlink"});
    TABLE_COLS.forEach(col=>{
      let raw = rowValue(s, col.key);
      let display;
      if(col.key==="name") display = s.name + " ("+s.code+")";
      else if(col.pct) display = fmtPct(raw);
      else if(col.fmt) display = col.fmt(raw);
      else if(col.key==="score") display = raw==null? "—" : String(raw);
      else if(col.key==="popularRating") display = s.popularIpo?.evaluation || "—";
      else if(typeof raw === "number") display = fmtNum(raw);
      else display = raw==null? "—" : String(raw);
      const td = h("td",{class: col.num? "num mono":""}, display);
      tr.appendChild(td);
    });
    tr.addEventListener("click", ()=>openDetail(s.code));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

/* ---------------------------- ランキング ---------------------------- */
const RANK_KINDS = [
  ["total","総合"], ["growth","成長性"], ["value","割安度"], ["drop","株価下落"],
  ["kessan","決算"], ["finance","財務"], ["popular","庶民のIPO評価"]
];
function rankScoreFn(kind){
  return (s)=>{
    const m = computeMetrics(s); const sc = s.upcoming? null : computeScore(s);
    switch(kind){
      case "total": return sc? sc.total : -Infinity;
      case "growth": return sc? sc.growth : -Infinity;
      case "value": return sc? sc.valuation : -Infinity;
      case "drop": return m.fromFirstDay!=null ? -m.fromFirstDay : -Infinity;
      case "kessan": return sc? (sc.profit+sc.forecast) : -Infinity;
      case "finance": return sc? sc.finance : -Infinity;
      case "popular": return (s.popularIpo && ({S:5,A:4,B:3,C:2,D:1}[s.popularIpo.evaluation])) || -Infinity;
      default: return -Infinity;
    }
  };
}
function renderRanking(){
  const wrap = h("div",{});
  wrap.appendChild(h("div",{class:"section-title"},"IPOランキング"));
  const toggle = h("div",{class:"view-toggle"});
  RANK_KINDS.forEach(([key,label])=>{
    const btn = h("button",{class:"chip-btn"+(state.rankKind===key?" active":"")}, label);
    btn.addEventListener("click", ()=>{ state.rankKind = key; render(); });
    toggle.appendChild(btn);
  });
  wrap.appendChild(toggle);
  const fn = rankScoreFn(state.rankKind);
  const ranked = state.stocks.filter(s=>!s.upcoming && withinRetention(s)).map(s=>({s, v:fn(s)})).filter(r=>r.v>-Infinity).sort((a,b)=>b.v-a.v);
  if(ranked.length===0){ wrap.appendChild(emptyState("ランキング対象のデータがありません","決算・株価データを登録してください。")); return wrap; }
  const list = h("div",{class:"grid-cards"});
  ranked.forEach((r,i)=>{
    const card = stockCard(r.s, true);
    card.insertBefore(h("div",{style:"font-family:var(--font-num); font-weight:900; font-size:15px; color:var(--accent); margin-bottom:4px;"}, "#"+(i+1)), card.firstChild);
    list.appendChild(card);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderAnalysis(){
  const wrap = h("div",{});
  wrap.appendChild(h("div",{class:"section-title"},"庶民のIPO × 実績 分析"));
  wrap.appendChild(h("div",{class:"note-disclaimer"},"「庶民のIPO」は外部サイトの事前評価です。JPX等の一次情報とは区別して扱っています。自動取得はしていないため、値が未登録の銘柄は集計から除外されます。"));

    h("th",{},"180日後平均騰落率"),h("th",{},"365日後平均騰落率"),h("th",{},"プラス転換率")
  ])));
  const tbody = h("tbody",{});
  for(const grade of ["S","A","B","C","D"]){
    const group = withRating.filter(s=>s.popularIpo.evaluation===grade);
    if(group.length===0) continue;
    const firstDayChgs = group.map(s=>pct(s.firstDayPrice, s.ipoPrice)).filter(v=>v!=null);
    const d180 = group.map(s=>{ const pv=popularVsActual(s); return pct(pv.d180, s.ipoPrice); }).filter(v=>v!=null);
    const d365 = group.map(s=>{ const pv=popularVsActual(s); return pct(pv.d365, s.ipoPrice); }).filter(v=>v!=null);
    const currentChgs = group.map(s=>pct(s.currentPrice, s.ipoPrice)).filter(v=>v!=null);
    const plusRate = currentChgs.length? (currentChgs.filter(v=>v>0).length/currentChgs.length*100) : null;
    tbody.appendChild(h("tr",{},[
      h("td",{},grade),
      h("td",{class:"num mono"}, String(group.length)),
      h("td",{class:"num mono"}, avgFmt(firstDayChgs)),
      h("td",{class:"num mono"}, avgFmt(d180)),
      h("td",{class:"num mono"}, avgFmt(d365)),
      h("td",{class:"num mono"}, plusRate!=null? plusRate.toFixed(0)+"%":"—")
    ]));
  }
  tbl.appendChild(tbody);
  table.appendChild(tbl);
  wrap.appendChild(table);

  wrap.appendChild(sectionTitle("意外な掘り出し物パターン", "高評価（S/A）＋業績良好＋株価下落　／　低評価（C/D）＋業績良好＋割安"));
  const patternA = state.stocks.filter(s=>{
    if(s.upcoming || !s.popularIpo || !s.popularIpo.evaluation) return false;
    const m = computeMetrics(s); const fin = m.fin;
    return ["S","A"].includes(s.popularIpo.evaluation) && fin && fin.revenueGrowth>=10 && fin.opProfitGrowth>=10 && m.fromFirstDay<0;
  });
  const patternD = state.stocks.filter(s=>{
    if(s.upcoming || !s.popularIpo || !s.popularIpo.evaluation) return false;
    const m = computeMetrics(s); const fin = m.fin;

  wrap.appendChild(patternA.length? cardGrid(patternA,true) : h("div",{class:"section-desc"},"該当なし"));

function priceChart(s){
  const points = [...s.priceHistory].sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(points.length<2) return h("div",{});

  // 横幅は画面内に収まる固定ロジカル幅（CSSでレスポンシブに縮小表示される）
  const w = 680, hgt = 200, padL = 46, padR = 16, padT = 16, padB = 30;
  const startDate = new Date(points[0].date);
  const endDate = new Date(points[points.length-1].date);
  const spanMs = Math.max(1, endDate - startDate);

  const prices = points.map(p=>p.price).filter(v=>v!=null);
  let min = Math.min(...prices), max = Math.max(...prices);
  // 上場時価格（初値優先、なければ公開価格）も表示範囲に含める
  const refPrice = s.firstDayPrice!=null ? s.firstDayPrice : s.ipoPrice;
  if(refPrice!=null){ min = Math.min(min, refPrice); max = Math.max(max, refPrice); }
  if(min===max){ min -= 1; max += 1; }

  const xFor = (date)=> padL + ( (date-startDate)/spanMs ) * (w-padL-padR);
  const yFor = (v)=> hgt-padB - ( (v-min)/(max-min) )*(hgt-padT-padB);

  const svgParts = [];
  svgParts.push(`<svg class="price-chart mono" viewBox="0 0 ${w} ${hgt}" width="100%" height="${hgt}" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">`);

  // 3ヶ月ごとの縦グリッド線＋日付ラベル
  const gridDate = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  while(gridDate <= endDate){
    const gx = xFor(gridDate);
    if(gx >= padL && gx <= w-padR){
      svgParts.push(`<line x1="${gx.toFixed(1)}" y1="${padT}" x2="${gx.toFixed(1)}" y2="${hgt-padB}" stroke="var(--line)" stroke-width="1" />`);
      const label = gridDate.getFullYear().toString().slice(2)+"/"+(gridDate.getMonth()+1);
      svgParts.push(`<text x="${gx.toFixed(1)}" y="${hgt-10}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${label}</text>`);
    }
    gridDate.setMonth(gridDate.getMonth()+3);
  }

  // 上場時価格から伸びる赤の点線
  if(refPrice!=null){
    const ry = yFor(refPrice);
    svgParts.push(`<line x1="${padL}" y1="${ry.toFixed(1)}" x2="${w-padR}" y2="${ry.toFixed(1)}" stroke="var(--up)" stroke-width="1.5" stroke-dasharray="5 4" />`);
    svgParts.push(`<text x="${w-padR}" y="${(ry-4).toFixed(1)}" font-size="9" fill="var(--up)" text-anchor="end">上場時 ${refPrice.toLocaleString()}円</text>`);
  }

  let path = points.map((p,i)=> (i===0?"M":"L")+xFor(new Date(p.date)).toFixed(1)+","+yFor(p.price).toFixed(1)).join(" ");
  svgParts.push(`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" />`);
  points.forEach((p)=> svgParts.push(`<circle cx="${xFor(new Date(p.date)).toFixed(1)}" cy="${yFor(p.price).toFixed(1)}" r="2.5" fill="var(--accent)" />`) );

  svgParts.push(`<text x="${padL}" y="12" font-size="10" fill="var(--ink-soft)">${Math.round(max).toLocaleString()}円</text>`);
  svgParts.push(`<text x="${padL}" y="${hgt-padB+2}" font-size="10" fill="var(--ink-soft)">${Math.round(min).toLocaleString()}円</text>`);
  svgParts.push(`</svg>`);
  const wrap = h("div",{class:"chart-wrap", html: svgParts.join("")});
  return wrap;
}

  const fs2 = h("fieldset",{},[h("legend",{},"価格・株数")]);

  const underwriterInput = fieldInput("主幹事", f.leadUnderwriter, "text");
  const bvpsInput = fieldInput("1株あたり純資産（PBR用・任意）", f.bookValuePerShare, "number");
  const sharesOutInput = fieldInput("発行済株式数（PSR用・任意）", f.sharesOutstanding, "number");
  [ipoPriceInput,firstDayInput,currentInput,prevCloseInput,volumeInput,w52hInput,w52lInput,athInput,atlInput,capInput,pubSharesInput,sellSharesInput,priceRangeInput,underwriterInput,bvpsInput,sharesOutInput]
    .forEach(x=>grid2.appendChild(x.wrap));
  fs2.appendChild(grid2);

  const fs3 = h("fieldset",{},[h("legend",{},"出典")]);
  const grid3 = h("div",{class:"form-grid"});

  grid3.appendChild(sourceInput.wrap);
  fs3.appendChild(grid3);
  fs3.appendChild(h("div",{class:"field-note"},"取得できない項目は空欄のままにしてください（推測値は入力しないでください）。"));

  wrap.appendChild(fs1); wrap.appendChild(fs2); wrap.appendChild(fs3);

    if(!isEdit && findStock(code)){ showToast("同じ銘柄コードが既に存在します"); return; }
    const num = (el)=> el.input.value===""? null : Number(el.input.value);
    const stock = existing ? {...existing} : {
      financials:[], priceHistory:[], memo:"", watchlisted:false, popularIpo:{}
    };
    Object.assign(stock, {
      code, name, market: marketInput.input.value,
      upcoming: upcomingChk.querySelector("input").checked,
      listedDate: listedDateInput.input.value || null,
      plannedListingDate: plannedDateInput.input.value || null,
      ipoPrice: num(ipoPriceInput), firstDayPrice: num(firstDayInput), currentPrice: num(currentInput),
      currentPriceUpdatedAt: num(currentInput)!=null ? new Date().toISOString() : stock.currentPriceUpdatedAt,
      prevClose: num(prevCloseInput), volume: num(volumeInput),
      week52High: num(w52hInput), week52Low: num(w52lInput), allTimeHigh: num(athInput), allTimeLow: num(atlInput),
      marketCap: num(capInput), publicShares: num(pubSharesInput), sellShares: num(sellSharesInput),
      assumedPriceRange: priceRangeInput.input.value, leadUnderwriter: underwriterInput.input.value,
      bookValuePerShare: num(bvpsInput), sharesOutstanding: num(sharesOutInput),
      dataSource: sourceInput.input.value, dataRetrievedAt: new Date().toISOString()
    });
    if(stock.currentPrice!=null && (!stock.priceHistory || stock.priceHistory.length===0 || stock.priceHistory[stock.priceHistory.length-1].price!==stock.currentPrice)){
      stock.priceHistory = stock.priceHistory || [];
      stock.priceHistory.push({date:new Date().toISOString().slice(0,10), price:stock.currentPrice});
    }
    await saveStock(stock);
    showToast(isEdit? "保存しました":"追加しました");
    state.view = "detail"; state.detailCode = code; render();
  });
  const cancelBtn = h("button",{class:"btn secondary"},"キャンセル");
  cancelBtn.addEventListener("click", ()=>{ state.view = isEdit? "detail":"list"; render(); });
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);
  return wrap;
}
function fieldInput(label, value, type, placeholder){
  const input = h("input",{type: type||"text"});
  if(value!=null) input.value = value;
  if(placeholder) input.setAttribute("placeholder", placeholder);
  const wrap = h("div",{class:"field"},[h("label",{},label), input]);
  return {wrap, input};
}

/* ---------------------------- Quick modals: 株価更新／決算追加／庶民のIPO編集 ---------------------------- */
function openModal(title, buildFn){
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  const overlay = h("div",{class:"modal-overlay"});
  const sheet = h("div",{class:"modal-sheet"});
  const head = h("div",{class:"modal-head"},[h("h3",{},title)]);
  const closeBtn = h("button",{class:"close-x"},"×");
  const close = ()=>{ root.innerHTML=""; };
  closeBtn.addEventListener("click", close);
  head.appendChild(closeBtn);
  sheet.appendChild(head);
  const body = h("div",{});
  sheet.appendChild(body);
  overlay.appendChild(sheet);
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) close(); });
  root.appendChild(overlay);
  buildFn(body, close);
}

async function exportBackup(){
  const stocks = await idbGetAll("stocks");
  const settings = await idbGet("settings","main");
  const payload = {
    appName:"ipo-tracker", dataVersion: DATA_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    stocks, settings
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().replace(/[:.]/g,"-");
  a.href = url; a.download = `ipo-tracker-backup-${ts}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("バックアップを書き出しました");
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload.stocks) throw new Error("形式が不正です");
      openModal("復元の確認", (body,close)=>{
        body.appendChild(h("p",{},`銘柄 ${payload.stocks.length}件 を含むバックアップ（データバージョン ${payload.dataVersion||"不明"}）を復元します。現在のデータは上書きされます。`));
        const row = h("div",{class:"btn-row"});
        const cancel = h("button",{class:"btn secondary"},"キャンセル"); cancel.addEventListener("click", close);
        const ok = h("button",{class:"btn"},"復元する");
        ok.addEventListener("click", async ()=>{
          for(const s of payload.stocks) await idbPut("stocks", s);
          if(payload.settings) await idbPut("settings", payload.settings);
          await loadAll();
          close(); render(); showToast("復元しました");
        });
        row.appendChild(cancel); row.appendChild(ok); body.appendChild(row);
      });
    }catch(err){ showToast("読み込みに失敗しました: "+err.message); }
  };
  reader.readAsText(file);
}

/* ---------------------------- Boot ---------------------------- */
async function loadAll(){
  state.stocks = await idbGetAll("stocks");
  const s = await idbGet("settings","main");
  if(s) state.settings = Object.assign(state.settings, s);
}

async function boot(){
  await openDB();

  // v9 migration: 5桁J-Quantsコードの重複統合、インタビュー文言除去、保持期間4年化
  await migrateStoredStocksV9();
  await loadAll();

  if(state.stocks.length===0){
    for(const s of sampleStocks()) await idbPut("stocks", s);
    await loadAll();
  }

  if(!state.settings.retentionDays || state.settings.retentionDays < 1460){
    state.settings.retentionDays = 1460;
  }
  await saveSettings.call(null);
  render();
}
boot();
